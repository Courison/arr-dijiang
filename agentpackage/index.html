<main id="mainContent">
    <div class="page-shell">
        <div class="ap-header">
            <div>
                <h1 class="page-shell-title">👥 干员天赋一览</h1>
                <p class="page-shell-subtitle">按默认顺序展示所有干员的天赋，可筛选、可修改练度</p>
            </div>
            <button class="ap-edit-btn" id="apOpenEditBtn">✏️ 干员练度修改</button>
        </div>

        <div class="ap-filters">
            <div class="ap-filter-row">
                <span class="ap-filter-label">星级</span>
                <div class="ap-filter-tags" data-filter="star">
                    <button class="ap-filter-tag active" data-value="all">全部</button>
                    <button class="ap-filter-tag" data-value="六星">六星</button>
                    <button class="ap-filter-tag" data-value="五星">五星</button>
                    <button class="ap-filter-tag" data-value="四星">四星</button>
                </div>
            </div>
            <div class="ap-filter-row">
                <span class="ap-filter-label">工作舱室</span>
                <div class="ap-filter-tags" data-filter="room">
                    <button class="ap-filter-tag active" data-value="all">全部</button>
                    <button class="ap-filter-tag" data-value="总控中枢">总控中枢</button>
                    <button class="ap-filter-tag" data-value="制造舱">制造舱</button>
                    <button class="ap-filter-tag" data-value="培养舱">培养舱</button>
                    <button class="ap-filter-tag" data-value="会客室">会客室</button>
                </div>
            </div>
            <div class="ap-filter-row">
                <span class="ap-filter-label">天赋类型</span>
                <div class="ap-filter-tags" data-filter="type">
                    <button class="ap-filter-tag active" data-value="all">全部</button>
                    <button class="ap-filter-tag" data-value="心情回复">心情回复</button>
                    <button class="ap-filter-tag" data-value="心情减耗">心情减耗</button>
                    <button class="ap-filter-tag" data-value="效率提升">效率提升</button>
                    <button class="ap-filter-tag" data-value="线索概率提升">线索概率提升</button>
                </div>
            </div>
            <div class="ap-filter-row">
                <span class="ap-filter-label">激活状态</span>
                <div class="ap-filter-tags" data-filter="status">
                    <button class="ap-filter-tag active" data-value="all">全部</button>
                    <button class="ap-filter-tag" data-value="active">已激活</button>
                    <button class="ap-filter-tag" data-value="inactive">未激活</button>
                </div>
            </div>
        </div>

        <div class="ap-divider"></div>

        <div id="apContent">
            <p class="ap-loading">加载中…</p>
        </div>
    </div>

<!-- ========== 干员练度修改弹窗 ========== -->
<div class="modal-overlay" id="apEditModal">
    <div class="ap-modal">
        <div class="ap-modal-header">
            <button class="ap-modal-back" id="apModalBack" style="display:none;">← 返回</button>
            <h2 id="apModalTitle">✏️ 选择干员</h2>
            <button class="ap-modal-close" id="apModalClose">✕</button>
        </div>

        <div class="ap-modal-body" id="apSelectView">
            <input type="text" id="apSearchInput" class="ap-search" placeholder="搜索干员名…" autocomplete="off">
            <div class="ap-operator-grid" id="apOperatorGrid"></div>
        </div>

        <div class="ap-modal-body" id="apEditView" style="display:none;">
            <div class="ap-edit-hero">
                <img id="apEditAvatar" class="ap-edit-avatar" src="" alt="">
                <div class="ap-edit-info">
                    <div class="ap-edit-name" id="apEditName">—</div>
                    <div class="ap-edit-meta" id="apEditMeta">—</div>
                </div>
            </div>

            <div class="ap-edit-section-title">精英化等级</div>
            <div class="ap-elite-group" id="apEliteGroup">
                <button data-level="none">未拥有</button>
                <button data-level="精零">精零</button>
                <button data-level="精一">精一</button>
                <button data-level="精二">精二</button>
                <button data-level="精三">精三</button>
                <button data-level="精四">精四</button>
            </div>

            <div class="ap-edit-section-title">天赋激活（点击切换）</div>
            <div class="ap-talent-edit-list" id="apTalentEditList"></div>

            <div class="ap-edit-footer">
                <button class="ap-btn ap-btn-cancel" id="apEditCancel">取消</button>
                <button class="ap-btn ap-btn-save" id="apEditSave">保存</button>
            </div>
        </div>
    </div>
</div>
