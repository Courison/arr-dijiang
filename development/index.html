    <!-- 顶配推荐样式 -->
    <style>
        .dev-top-recommend {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e8ecf0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .dev-top-recommend h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #2a5a4a;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }
        
        /* ★ 新增：简易排班图 */
        .dev-simple-schedule {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #e8ecf0;
        }
        .dev-schedule-room {
            background: #f8fafc;
            border: 1px solid #e8ecf0;
            border-radius: 10px;
            padding: 12px;
        }
        .dev-schedule-room-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2a5a4a;
            margin-bottom: 8px;
            text-align: center;
            border-bottom: 1px solid #e8ecf0;
            padding-bottom: 6px;
        }
        .dev-schedule-ops {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            justify-items: center;
            margin-bottom: 8px;
        }
        .dev-schedule-round-label {
            font-size: 0.75rem;
            color: #888;
            font-weight: 600;
            margin: 6px 0 4px;
            text-align: left;
        }
        .dev-schedule-op {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 44px;
        }
        .dev-schedule-op img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #eaeaea;
            border: 1px solid #ccc;
        }
        .dev-schedule-op .op-name {
            font-size: 0.65rem;
            margin-top: 2px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        /* 顶配干员列表 */
        .dev-top-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-start;
        }
        .dev-group-divider {
            width: 1px;
            background-color: #e0e6ea;
            margin: 0 4px;
            align-self: stretch;
            min-height: 80px;
        }
        .dev-top-card {
            position: relative;
            width: 72px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s;
        }
        .dev-top-card:hover { transform: translateY(-4px); }
        .dev-top-card img {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid transparent;
            background: #eaeaea;
            margin: 0 auto;
        }
        .dev-top-card.maxed img { border-color: #3f7e6b; }
        .dev-top-card:not(.maxed) img { border-color: #ff9800; }
        .dev-top-card .name {
            font-size: 0.78rem;
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #333;
            font-weight: 600;
        }
        .dev-top-card .badge {
            position: absolute;
            top: -8px;
            right: 0px;
            background: #ff9800;
            color: #fff;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 700;
            box-shadow: 0 2px 4px rgba(255,152,0,0.3);
        }
        .dev-top-card.maxed .badge { display: none; }
        .dev-top-card .dev-plan-card-meta {
            font-size: 0.62rem;
            color: #6b7b73;
            line-height: 1.35;
            margin-top: 3px;
            white-space: normal;
        }
        .dev-top-grid .dev-top-card { width: 140px; }
        .dev-plan-tooltip {
            display: none;
            position: absolute;
            z-index: 20;
            left: 50%;
            bottom: calc(100% + 8px);
            transform: translateX(-50%);
            width: 230px;
            background: #26352f;
            color: #eef6f2;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.68rem;
            line-height: 1.55;
            text-align: left;
            white-space: normal;
            box-shadow: 0 6px 18px rgba(0,0,0,.18);
            pointer-events: none;
        }
        .dev-top-card:hover .dev-plan-tooltip { display: block; }
        .dev-plan-tooltip .tip-title { color: #9ed6bf; font-weight: 700; margin-bottom: 2px; }
        .dev-plan-tooltip .tip-line { color: #dfece6; }
        .dev-plan-tooltip .tip-talent { display:flex; align-items:flex-start; gap:6px; margin-top:3px; }
        .dev-plan-tooltip .tip-talent-icon { width:18px; height:18px; flex:0 0 18px; border-radius:4px; object-fit:cover; background:#eef6f2; }
        .dev-plan-tooltip .tip-talent-placeholder { width:18px; height:18px; flex:0 0 18px; }
        .dev-plan-tooltip .tip-talent-body { flex:1; min-width:0; }
        .dev-plan-tooltip .tip-talent-name { color:#eef6f2; font-weight:600; line-height:1.35; }
        .dev-plan-tooltip .tip-talent-effect { color:#9fb8ac; line-height:1.35; margin-top:1px; }
        .dev-loading-spinner {
            width: 26px; height: 26px; margin: 4px auto 9px;
            border: 3px solid #dfe8e2; border-top-color: #3f7e6b;
            border-radius: 50%; animation: dev-spin .8s linear infinite;
        }
        @keyframes dev-spin { to { transform: rotate(360deg); } }
        .dev-plan-loading {
            width:100%;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            color:#6b7b73;
            font-size:0.8rem;
            padding:12px 0;
        }
        .dev-simple-schedule .dev-plan-loading { grid-column:1/-1; }
        #devTopGrid .dev-plan-loading { flex:1 0 100%; }
        .dev-plan-actions { display:none; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
        .dev-plan-actions.show { display:flex; }
        .dev-plan-actions button {
            border:1px solid #cddfd5; background:#fff; color:#2f5f4d; border-radius:7px;
            padding:6px 10px; font-size:0.78rem; cursor:pointer;
        }
        .dev-plan-actions button.primary { background:#3f7e6b; border-color:#3f7e6b; color:#fff; font-weight:600; }
        .dev-plan-actions .plan-selected-count { color:#6b7b73; font-size:0.76rem; margin-left:auto; }
        .dev-top-card.selected img { border-color:#3f7e6b !important; box-shadow:0 0 0 2px rgba(63,126,107,.2); }
        .dev-top-card .dev-select-check {
            position:absolute; top:-6px; left:-6px; width:20px; height:20px; border-radius:50%;
            background:#fff; border:2px solid #cddfd5; color:transparent; font-size:12px;
            display:flex; align-items:center; justify-content:center; z-index:3;
        }
        .dev-top-card.selected .dev-select-check { background:#3f7e6b; border-color:#3f7e6b; color:#fff; }
        .dev-unactivated { margin-top:18px; background:#fff; border:1px solid #e8ecf0; border-radius:12px; padding:0 14px 12px; }
        .dev-unactivated summary { cursor:pointer; padding:12px 0; font-weight:700; color:#2a5a4a; font-size:0.9rem; }
        .dev-unactivated-filters { display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 10px; }
        .dev-unactivated-filters button { border:1px solid #dbe7e1; background:#f8fbf9; color:#3f6b59; border-radius:6px; padding:4px 9px; font-size:0.72rem; cursor:pointer; }
        .dev-unactivated-filters button.active { background:#3f7e6b; border-color:#3f7e6b; color:#fff; }
        .dev-unactivated-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:7px; }
        .dev-unactivated-item { display:flex; align-items:center; gap:8px; border:1px solid #edf2ef; border-radius:7px; padding:6px 8px; font-size:0.75rem; }
        .dev-unactivated-item img { width:28px; height:28px; border-radius:50%; object-fit:cover; }
        .dev-unactivated-item .u-name { font-weight:600; color:#334; }
        .dev-unactivated-item .u-meta { color:#7b8981; font-size:0.68rem; }
    </style>
</head>
