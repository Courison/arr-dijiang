    <!-- 顶配推荐样式 -->
    <style>
        .dev-top-recommend {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e8ecf0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .dev-top-recommend h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #2a5a4a;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }
        
        /* ★ 新增：简易排班图 */
        .dev-simple-schedule {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #e8ecf0;
        }
        .dev-schedule-room {
            background: #f8fafc;
            border: 1px solid #e8ecf0;
            border-radius: 10px;
            padding: 12px;
        }
        .dev-schedule-room-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2a5a4a;
            margin-bottom: 8px;
            text-align: center;
            border-bottom: 1px solid #e8ecf0;
            padding-bottom: 6px;
        }
        .dev-schedule-ops {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }
        .dev-schedule-op {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 44px;
        }
        .dev-schedule-op img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #eaeaea;
            border: 1px solid #ccc;
        }
        .dev-schedule-op .op-name {
            font-size: 0.65rem;
            margin-top: 2px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        /* 顶配干员列表 */
        .dev-top-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .dev-top-card {
            position: relative;
            width: 72px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s;
        }
        .dev-top-card:hover { transform: translateY(-4px); }
        .dev-top-card img {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid transparent;
            background: #eaeaea;
            margin: 0 auto;
        }
        .dev-top-card.maxed img { border-color: #3f7e6b; }
        .dev-top-card:not(.maxed) img { border-color: #ff9800; }
        .dev-top-card .name {
            font-size: 0.78rem;
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #333;
            font-weight: 600;
        }
        .dev-top-card .badge {
            position: absolute;
            top: -8px;
            right: 0px;
            background: #ff9800;
            color: #fff;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 700;
            box-shadow: 0 2px 4px rgba(255,152,0,0.3);
        }
        .dev-top-card.maxed .badge { display: none; }
    </style>
</head>
