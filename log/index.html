<script>
(function () {
    'use strict';

    const content = document.getElementById('logContent');
    if (!content) return;

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
    }

    function render(md) {
        if (!md || !md.trim()) {
            content.innerHTML = '<p class="log-empty">暂无更新日志。</p>';
            return;
        }
        try {
            content.innerHTML = marked.parse(md);
            // 让页内锚点平滑滚动
            document.documentElement.style.scrollBehavior = 'smooth';
        } catch (e) {
            content.innerHTML = '<p class="log-error">日志渲染失败：' + escapeHtml(e.message || '未知错误') + '</p>';
        }
    }

    fetch('/log/log.md', { cache: 'no-cache' })
        .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        })
        .then(render)
        .catch(function (err) {
            content.innerHTML = '<p class="log-error">加载失败：' + escapeHtml(err.message) + '</p>';
        });
})();
</script>
